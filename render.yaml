services:
  - type: web
    name: autoelectrico-bribiesca
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: DATABASE_URL
        fromDatabase:
          name: autoelectrico-bribiesca-db
          property: connectionString

databases:
  - name: autoelectrico-bribiesca-db
    plan: free
